name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_call: # the release workflow runs the same checks before releasing

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium # BasePage and accessibility tests
            - run: npm run lint # ESLint + type-check
            - run: npx prettier --check .
            - run: npm run test:coverage
            - name: Coverage summary
              if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
              run: |
                  node -e '
                    const { total } = require("./coverage/coverage-summary.json");
                    const rows = ["lines", "statements", "functions", "branches"]
                      .map((k) => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`);
                    console.log(["### Coverage of src/", "", "| | % | covered |", "|---|---|---|", ...rows].join("\n"));
                  ' >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 14
            - run: npm run build
