name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint # ESLint + type-check
            - run: npx prettier --check .
            - run: npx playwright test
            - run: npm run build
