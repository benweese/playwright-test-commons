name: Release

# Pushing a tag like v0.3.0 builds the package and attaches it to a GitHub Release.
# Test repos install that file:
#   https://github.com/benweese/playwright-test-commons/releases/download/v0.3.0/benweese-playwright-test-commons-0.3.0.tgz

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npx playwright test
            - name: Check the tag matches package.json
              run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
            - run: npm pack # runs the build through prepack
            - name: Create the GitHub Release with the package attached
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --generate-notes
