name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    release:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: write # create the release
        steps:
            - uses: actions/checkout@v7
            - name: Check the tag matches package.json
              run: |
                  version="$(node -p 'require("./package.json").version')"
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
                    exit 1
                  fi
            - name: Release notes from CHANGELOG.md
              run: |
                  # The lines between "## [x.y.z]" and the next "## [" heading or the link list.
                  awk -v heading="## [${GITHUB_REF_NAME#v}]" '
                    index($0, heading) == 1 { found = 1; next }
                    found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
                    found { print }
                  ' CHANGELOG.md > notes.md
                  if ! grep -q '[^[:space:]]' notes.md; then
                    echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
                    exit 1
                  fi
                  cat notes.md
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
